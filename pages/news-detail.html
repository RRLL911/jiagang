            </div>
        </div>

    <script>
        lucide.createIcons();
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : text;
            return div.innerHTML;
        }

        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                if (!res.ok) return;
                const { settings } = await res.json();
                if (settings.company_name) document.querySelectorAll('.site-name').forEach(el => el.textContent = settings.company_name.replace('科技有限公司', '科技'));
                if (settings.company_slogan) document.querySelectorAll('.site-slogan').forEach(el => el.textContent = settings.company_slogan);
                if (settings.company_name) document.querySelectorAll('.site-full-name').forEach(el => el.textContent = settings.company_name);
                if (settings.phone) document.querySelectorAll('.site-phone').forEach(el => {
                    const text = el.tagName === 'A' ? ('<span data-lucide="phone" class="inline w-4 h-4 mr-1"></span>' + escapeHtml(settings.phone)) : escapeHtml(settings.phone);
                    if (el.tagName === 'A') {
                        el.href = 'tel:' + settings.phone;
                        el.innerHTML = text;
                    } else {
                        el.textContent = settings.phone;
                    }
                });
                if (settings.email) document.querySelectorAll('.site-email').forEach(el => {
                    if (el.tagName === 'A') el.href = 'mailto:' + settings.email;
                    el.textContent = settings.email;
                });
                if (settings.address) document.querySelectorAll('.site-address').forEach(el => el.textContent = settings.address);
                if (settings.copyright_year) document.querySelectorAll('.site-copyright-year').forEach(el => el.textContent = settings.copyright_year);
                if (settings.seo_description) document.querySelectorAll('.site-footer-intro').forEach(el => el.textContent = settings.seo_description);
                if (settings.work_time) document.querySelectorAll('.site-work-time').forEach(el => el.textContent = settings.work_time);
                if (settings.service_regions) document.querySelectorAll('.site-service-regions').forEach(el => el.textContent = settings.service_regions);
            } catch (e) { console.error(e); }
        }

        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('article-content');
            if (!id) {
                container.innerHTML = '<div class="text-center py-12 text-[var(--jiagang-muted-fg)]">缺少文章标识</div>';
                return;
            }
            try {
                const res = await fetch('/api/articles/' + encodeURIComponent(id));
                if (!res.ok) {
                    container.innerHTML = '<div class="text-center py-12 text-[var(--jiagang-muted-fg)]">文章不存在或已删除</div>';
                    return;
                }
                const article = await res.json();
                if (!article || !article.id) {
                    container.innerHTML = '<div class="text-center py-12 text-[var(--jiagang-muted-fg)]">文章不存在或已删除</div>';
                    return;
                }
                document.title = escapeHtml(article.title) + ' - 唐山嘉港环保科技有限公司';
                container.innerHTML = `
                    <a href="news.html" class="inline-flex items-center text-sm text-[var(--jiagang-primary)] mb-6 hover:underline">
                        <span data-lucide="arrow-left" class="w-4 h-4 mr-1"></span>返回技术资讯
                    </a>
                    <h1 class="text-3xl lg:text-4xl font-bold text-[var(--jiagang-foreground)] mb-6">${escapeHtml(article.title)}</h1>
                    <div class="flex flex-wrap items-center gap-4 text-sm text-[var(--jiagang-muted-fg)] mb-8 pb-8 border-b border-[var(--jiagang-border)]">
                        ${article.published_at ? `<span class="flex items-center gap-1"><span data-lucide="calendar" class="w-4 h-4"></span>${escapeHtml(article.published_at)}</span>` : ''}
                        ${article.author ? `<span class="flex items-center gap-1"><span data-lucide="user" class="w-4 h-4"></span>${escapeHtml(article.author)}</span>` : ''}
                        ${article.category ? `<span class="px-2 py-0.5 rounded-full bg-[var(--jiagang-primary-50)] text-[var(--jiagang-primary)]">${escapeHtml(article.category)}</span>` : ''}
                        ${article.view_count != null ? `<span class="flex items-center gap-1"><span data-lucide="eye" class="w-4 h-4"></span>${escapeHtml(String(article.view_count))}</span>` : ''}
                    </div>
                    ${article.cover_icon ? `
                    <div class="h-64 bg-[var(--jiagang-primary-50)] rounded-2xl flex items-center justify-center mb-8">
                        <span data-lucide="${escapeHtml(article.cover_icon)}" class="w-24 h-24 text-[var(--jiagang-primary-300)]"></span>
                    </div>
                    ` : ''}
                    <div class="article-content text-[var(--jiagang-foreground)]">${article.content || ''}</div>
                    <div class="mt-12 pt-8 border-t border-[var(--jiagang-border)]">
                        <a href="news.html" class="inline-flex items-center text-sm text-[var(--jiagang-primary)] hover:underline">
                            <span data-lucide="arrow-left" class="w-4 h-4 mr-1"></span>返回技术资讯
                        </a>
                    </div>
                `;
                lucide.createIcons();
            } catch (e) {
                container.innerHTML = '<div class="text-center py-12 text-[var(--state-error)]">文章加载失败，请刷新重试</div>';
            }
        }

        loadSettings();
        loadArticle();
        applyPageBlocks('news-detail');
    </script>

    <style>
        body { font-family: var(--font-body); background: var(--jiagang-background); color: var(--jiagang-foreground); }
