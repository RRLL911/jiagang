    <style id="theme-vars">

  --jiagang-neutral-50: #f8fafc;

  --jiagang-neutral-200: #e2e8f0;
  --jiagang-neutral-300: #cbd5e1;
  --jiagang-neutral-400: #94a3b8;

  --jiagang-neutral-800: #1e293b;

  --state-success: #10b981;
  --state-warning: #f59e0b;

  --state-info: #3b82f6;

  --font-title: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;

}

.dark {
  --jiagang-background: #0f172a;
  --jiagang-foreground: #f8fafc;
  --jiagang-card: #1e293b;
  --jiagang-card-foreground: #f8fafc;
  --jiagang-popover: #1e293b;
  --jiagang-popover-foreground: #f8fafc;
  --jiagang-primary: #14b8a6;
  --jiagang-primary-foreground: #0f172a;
  --jiagang-muted: #1e293b;
  --jiagang-muted-foreground: #94a3b8;
  --jiagang-border: #334155;
  --jiagang-input: #334155;
  --jiagang-ring: #14b8a6;
}

.font-title { font-family: var(--font-title); }
.font-body { font-family: var(--font-body); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--jiagang-background);
    --color-foreground: var(--jiagang-foreground);
    --color-card: var(--jiagang-card);
    --color-card-foreground: var(--jiagang-card-foreground);
    --color-popover: var(--jiagang-popover);
    --color-popover-foreground: var(--jiagang-popover-foreground);
    --color-primary: var(--jiagang-primary);
    --color-primary-foreground: var(--jiagang-primary-foreground);
    --color-muted: var(--jiagang-muted);
    --color-muted-foreground: var(--jiagang-muted-foreground);
    --color-border: var(--jiagang-border);
    --color-input: var(--jiagang-input);
    --color-ring: var(--jiagang-ring);
    --radius-sm: var(--jiagang-radius-small);
    --radius-md: var(--jiagang-radius-medium);
    --radius-lg: var(--jiagang-radius-large);
  }
  @layer base {
    body { background: var(--jiagang-background); color: var(--jiagang-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--jiagang-background); }
      .text-background { color: var(--jiagang-background); }
      .border-background { border-color: var(--jiagang-background); }
      .ring-background { --tw-ring-color: var(--jiagang-background); }
      .bg-foreground { background-color: var(--jiagang-foreground); }
      .text-foreground { color: var(--jiagang-foreground); }
      .border-foreground { border-color: var(--jiagang-foreground); }
      .ring-foreground { --tw-ring-color: var(--jiagang-foreground); }
      .bg-card { background-color: var(--jiagang-card); }
      .text-card { color: var(--jiagang-card); }
      .border-card { border-color: var(--jiagang-card); }
      .ring-card { --tw-ring-color: var(--jiagang-card); }
      .bg-card-foreground { background-color: var(--jiagang-card-foreground); }
      .text-card-foreground { color: var(--jiagang-card-foreground); }
      .border-card-foreground { border-color: var(--jiagang-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--jiagang-card-foreground); }
      .bg-popover { background-color: var(--jiagang-popover); }
      .text-popover { color: var(--jiagang-popover); }
      .border-popover { border-color: var(--jiagang-popover); }
      .ring-popover { --tw-ring-color: var(--jiagang-popover); }
      .bg-popover-foreground { background-color: var(--jiagang-popover-foreground); }
      .text-popover-foreground { color: var(--jiagang-popover-foreground); }
      .border-popover-foreground { border-color: var(--jiagang-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--jiagang-popover-foreground); }
      .bg-primary { background-color: var(--jiagang-primary); }
      .text-primary { color: var(--jiagang-primary); }
      .border-primary { border-color: var(--jiagang-primary); }
      .ring-primary { --tw-ring-color: var(--jiagang-primary); }
      .bg-primary-foreground { background-color: var(--jiagang-primary-foreground); }
      .text-primary-foreground { color: var(--jiagang-primary-foreground); }
      .border-primary-foreground { border-color: var(--jiagang-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--jiagang-primary-foreground); }
      .bg-muted { background-color: var(--jiagang-muted); }
      .text-muted { color: var(--jiagang-muted); }
      .border-muted { border-color: var(--jiagang-muted); }
      .ring-muted { --tw-ring-color: var(--jiagang-muted); }
      .bg-muted-foreground { background-color: var(--jiagang-muted-foreground); }
      .text-muted-foreground { color: var(--jiagang-muted-foreground); }
      .border-muted-foreground { border-color: var(--jiagang-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--jiagang-muted-foreground); }
      .bg-border { background-color: var(--jiagang-border); }
      .text-border { color: var(--jiagang-border); }
      .border-border { border-color: var(--jiagang-border); }
      .ring-border { --tw-ring-color: var(--jiagang-border); }
      .bg-input { background-color: var(--jiagang-input); }
      .text-input { color: var(--jiagang-input); }
      .border-input { border-color: var(--jiagang-input); }
      .ring-input { --tw-ring-color: var(--jiagang-input); }
      .bg-ring { background-color: var(--jiagang-ring); }
      .text-ring { color: var(--jiagang-ring); }
      .border-ring { border-color: var(--jiagang-ring); }
      .ring-ring { --tw-ring-color: var(--jiagang-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center login-bg p-4">
    <div class="w-full max-w-md rounded-2xl bg-white shadow-sm p-8">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-xl bg-[var(--jiagang-primary)] flex items-center justify-center text-white font-bold text-2xl mb-4">嘉</div>
            <h1 class="text-2xl font-bold text-[var(--jiagang-foreground)]">管理后台登录</h1>
            <p class="text-sm text-[var(--jiagang-muted-fg)] mt-1">唐山嘉港环保科技有限公司</p>
        </div>
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium mb-1.5">用户名</label>
                <div class="relative">
                    <span data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[var(--jiagang-muted-fg)]"></span>
                    <input type="text" name="username" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-[var(--jiagang-border)] bg-[var(--jiagang-background)] focus:outline-none focus:ring-2 focus:ring-[var(--jiagang-primary)]" placeholder="请输入用户名">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">密码</label>
                <div class="relative">
                    <span data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[var(--jiagang-muted-fg)]"></span>
                    <input type="password" name="password" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-[var(--jiagang-border)] bg-[var(--jiagang-background)] focus:outline-none focus:ring-2 focus:ring-[var(--jiagang-primary)]" placeholder="请输入密码">
                </div>
            </div>
            <div id="error-msg" class="hidden text-sm text-[var(--state-error)] bg-red-50 px-3 py-2 rounded-lg"></div>
            <button type="submit" class="w-full px-6 py-3 rounded-lg bg-[var(--jiagang-primary)] text-white font-semibold hover:bg-[var(--jiagang-primary-700)] transition-colors" data-dom-id="login-submit">登录</button>
        </form>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-[var(--jiagang-muted-fg)] hover:text-[var(--jiagang-primary)]" data-dom-id="back-home">返回官网首页</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));
            const errorEl = document.getElementById('error-msg');
            errorEl.classList.add('hidden');
            try {
                const res = await fetch('/admin/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok && result.token) {
                    localStorage.setItem('jiagang_admin_token', result.token);
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorEl.textContent = (result.detail ? `${result.error}：${result.detail}` : result.error) || '登录失败，请检查用户名和密码';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请稍后重试';
                errorEl.classList.remove('hidden');
            }
        });
    </script>

    <style>
        body { font-family: var(--font-body); background: var(--jiagang-background); color: var(--jiagang-foreground); }
        .login-bg { background: linear-gradient(135deg, var(--jiagang-primary-900) 0%, var(--jiagang-primary-700) 100%); }
    </style>
</body>
</html>
